# Pinned per build plan section 8: "Non-upgradeable Solidity for the first
# testnet deployment. Pin compiler and library versions."
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
bytecode_hash = "none"
# Deterministic builds: the artifact digest recorded onchain must be stable.
cbor_metadata = false
via_ir = false
# Read-only access to the shared vectors, so the Solidity side of milestone M5
# is checked against the same file Python and TypeScript are.
fs_permissions = [{ access = "read", path = "../packages/schemas" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
